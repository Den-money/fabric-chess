name: Build Fabric Mod

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew && ./gradlew build
          elif [ -f "./fabric-chess/gradlew" ]; then
            cd fabric-chess && chmod +x ./gradlew && ./gradlew build
          else
            echo "gradlew not found!" && exit 1
          fi

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: fabric-chess-mod
          path: "**/build/libs/*.jar"
